<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{config.title}}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><div class="app"><aside><div class="brand">✦ {{config.title}}</div><small>{{config.theme_name}}</small><button id="clear">＋ New Session</button><section><b>DOMAIN</b><p>{{config.domain}}</p></section><section class="bottom"><b>MODE</b><p>Focused assistant · Temporary session</p></section></aside><main><header><div><small>DOMAIN AI ASSISTANT</small><h1>{{config.title}}</h1></div><span>● Online</span></header><div id="chat"><div class="welcome"><div class="icon">✦</div><h2>{{config.welcome_title}}</h2><p>{{config.welcome_message}}</p><div class="chips"><button data-p="Explain the basics.">Basics</button><button data-p="Give practical steps.">Practical Steps</button><button data-p="Give examples.">Examples</button></div></div></div><form id="form"><textarea id="input" rows="1" placeholder="Ask {{config.title}}..."></textarea><button>Send ↗</button></form><footer>Session-based temporary chat · No login required</footer></main></div><script>
const c=document.querySelector("#chat"),i=document.querySelector("#input"),f=document.querySelector("#form");
function add(r,t){let e=document.createElement("article");e.className="msg "+r;e.innerHTML="<small>"+(r==="user"?"YOU":"{{config.title}}")+"</small><div></div>";e.querySelector("div").textContent=t;c.appendChild(e);c.scrollTop=c.scrollHeight}
async function send(t){t=t.trim();if(!t)return;add("user",t);i.value="";let l=document.createElement("article");l.className="msg bot";l.innerHTML="<small>{{config.title}}</small><div>Thinking...</div>";c.appendChild(l);try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})}),d=await r.json();l.remove();if(!r.ok)throw Error(d.error);add("bot",d.answer)}catch(e){l.remove();add("bot","Error: "+e.message)}}
f.onsubmit=e=>{e.preventDefault();send(i.value)};document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>send(b.dataset.p));document.querySelector("#clear").onclick=async()=>{await fetch("/api/clear",{method:"POST"});location.reload()};i.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();f.requestSubmit()}}
</script></body></html>
